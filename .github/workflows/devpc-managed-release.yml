name: DevPC managed release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 0.0.28-devpc.1
        required: true
  push:
    tags:
      - "devpc-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Build managed web and server
        env:
          VITE_DEVPC_MANAGED: "1"
          T3CODE_MANAGED_DEVPC: "1"
          T3CODE_TELEMETRY_ENABLED: "false"
        run: vp run --filter t3 build

      - name: Stage production runtime
        run: |
          mkdir -p artifacts
          corepack pnpm --config.node-linker=hoisted --config.inject-workspace-packages=true \
            --filter t3 deploy --prod --frozen-lockfile artifacts/devpc-t3
          npm_config_build_from_source=true \
            corepack pnpm --dir artifacts/devpc-t3 rebuild node-pty
          rm -rf \
            artifacts/devpc-t3/node_modules/@anthropic-ai/claude-agent-sdk-linux-x64-musl \
            artifacts/devpc-t3/node_modules/@anthropic-ai/claude-agent-sdk-win32-x64
          cp LICENSE artifacts/devpc-t3/LICENSE
          cp apps/web/THIRD_PARTY_NOTICES.md artifacts/devpc-t3/THIRD_PARTY_NOTICES.md
          tar -C artifacts/devpc-t3 -czf artifacts/devpc-t3-linux-x64.tar.gz .
          sha256sum artifacts/devpc-t3-linux-x64.tar.gz > artifacts/devpc-t3-linux-x64.tar.gz.sha256

      - name: Verify packaged contents
        run: |
          test -f artifacts/devpc-t3/dist/bin.mjs || { echo "Missing server bundle"; exit 1; }
          test -f artifacts/devpc-t3/dist/client/index.html || { echo "Missing web bundle"; exit 1; }
          test -f artifacts/devpc-t3/LICENSE || { echo "Missing license"; exit 1; }
          test -f artifacts/devpc-t3/node_modules/node-pty/build/Release/pty.node || {
            echo "Missing Linux node-pty binary"
            find artifacts/devpc-t3/node_modules/node-pty -maxdepth 4 -type f | sort
            exit 1
          }
          grep -R -m1 -q --include='*.js' "/_devpc/workspace/restart" \
            artifacts/devpc-t3/dist/client/assets || {
            echo "Missing managed DevPC restart surface"
            exit 1
          }
          grep -R -m1 -q --include='*.js' "/_devpc/workspace/start" \
            artifacts/devpc-t3/dist/client/assets || {
            echo "Missing managed DevPC resume surface"
            exit 1
          }
          grep -R -m1 -q --include='*.js' "/_devpc/workspace/stop" \
            artifacts/devpc-t3/dist/client/assets || {
            echo "Missing managed DevPC pause surface"
            exit 1
          }
          if grep -R -m1 -q --include='*.js' "/_devpc/workspace/settings" \
            artifacts/devpc-t3/dist/client/assets; then
            echo "Managed DevPC idle timeout is still adjustable"
            exit 1
          fi
          grep -R -m1 -q --include='*.js' "Pauses after 15 minutes of inactivity" \
            artifacts/devpc-t3/dist/client/assets || {
            echo "Missing fixed managed DevPC idle policy"
            exit 1
          }
          grep -q "/api/_devpc/activity" artifacts/devpc-t3/dist/bin.mjs || {
            echo "Missing managed DevPC activity endpoint"
            exit 1
          }
          grep -R -m1 -q --include='*.js' "data-devpc-workspace-control-center" \
            artifacts/devpc-t3/dist/client/assets || {
            echo "Missing managed DevPC control center"
            exit 1
          }
          grep -R -m1 -q --include='*.js' "data-devpc-account-button" \
            artifacts/devpc-t3/dist/client/assets || {
            echo "Missing managed DevPC account controls"
            exit 1
          }
          grep -R -m1 -q --include='*.js' "/_devpc/ws-ticket" \
            artifacts/devpc-t3/dist/client/assets || {
            echo "Missing managed DevPC WebSocket authorization"
            exit 1
          }

      - name: Verify packaged runtime
        timeout-minutes: 2
        run: |
          runtime_home="$(mktemp -d)"
          HOME="$runtime_home/home" \
            T3CODE_HOME="$runtime_home/t3code" \
            T3CODE_MANAGED_DEVPC=1 \
            WORKSPACE_GATEWAY_TOKEN=release-smoke-managed-gateway-token \
            T3CODE_TELEMETRY_ENABLED=false \
            node artifacts/devpc-t3/dist/bin.mjs start \
              --mode web --host 127.0.0.1 --port 4311 \
              --base-dir "$runtime_home/t3code" --no-browser "$runtime_home" \
              >"$runtime_home/runtime.log" 2>&1 &
          runtime_pid=$!
          trap 'kill "$runtime_pid" 2>/dev/null || true; rm -rf "$runtime_home"' EXIT
          for attempt in $(seq 1 30); do
            if ! kill -0 "$runtime_pid" 2>/dev/null; then
              cat "$runtime_home/runtime.log"
              echo "Packaged T3 runtime exited before becoming healthy"
              exit 1
            fi
            if curl --connect-timeout 2 --max-time 5 --fail --silent --show-error \
              http://127.0.0.1:4311/ >/dev/null; then
              activity="$(curl --connect-timeout 2 --max-time 5 --fail --silent --show-error \
                -H 'x-devpc-gateway-token: release-smoke-managed-gateway-token' \
                http://127.0.0.1:4311/api/_devpc/activity)"
              test "$activity" = '{"active":false,"working":false,"pendingWork":false}' || {
                echo "Unexpected managed activity response: $activity"
                exit 1
              }
              exit 0
            fi
            sleep 1
          done
          cat "$runtime_home/runtime.log"
          echo "Packaged T3 runtime did not become healthy"
          exit 1

      - uses: actions/upload-artifact@v7
        with:
          name: devpc-t3-linux-x64
          path: |
            artifacts/devpc-t3-linux-x64.tar.gz
            artifacts/devpc-t3-linux-x64.tar.gz.sha256

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Map the version input (0.0.28-devpc.54) to its release tag
            # (devpc-v0.0.28.54). `gh release create` creates the tag at
            # --target when it does not exist yet, so a dispatch run can
            # publish a full release without a separately pushed tag. The
            # input reaches the script through the environment so it can
            # never expand into shell syntax.
            version="$VERSION_INPUT"
            printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-devpc\.[0-9]+$' || {
              echo "Version input '$version' must look like 0.0.28-devpc.54"
              exit 1
            }
            # The tag labels the artifact built from this checkout, so its
            # base version must be the one the packages actually carry.
            base="${version%-devpc.*}"
            for pkg in apps/server/package.json apps/web/package.json; do
              pkg_version="$(node -p "require('./${pkg}').version")"
              if [ "$pkg_version" != "$base" ]; then
                echo "Version input base $base does not match $pkg version $pkg_version"
                exit 1
              fi
            done
            tag="devpc-v$(printf '%s' "$version" | sed 's/-devpc\./\./')"
            # --target only applies when the tag does not exist yet; an
            # existing tag pointing elsewhere would silently mislabel this
            # run's assets, so resolve it first and refuse on a mismatch.
            existing="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${tag}" --jq .sha 2>/dev/null || true)"
            if [ -n "$existing" ] && [ "$existing" != "$GITHUB_SHA" ]; then
              echo "Tag $tag already exists at $existing, not $GITHUB_SHA; refusing to publish"
              exit 1
            fi
            gh release create "$tag" \
              artifacts/devpc-t3-linux-x64.tar.gz \
              artifacts/devpc-t3-linux-x64.tar.gz.sha256 \
              --title "$tag" \
              --target "$GITHUB_SHA" \
              --generate-notes
          else
            gh release create "${GITHUB_REF_NAME}" \
              artifacts/devpc-t3-linux-x64.tar.gz \
              artifacts/devpc-t3-linux-x64.tar.gz.sha256 \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
